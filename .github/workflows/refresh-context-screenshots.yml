name: refresh-context-screenshots

on:
  push:
    branches:
      - feature/context-aware-prompt-enhance

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: npm ci
      - run: npm run ui:install -- --with-deps
      - run: just ui-test-force
      - name: Commit certified screenshots
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots
          if git diff --cached --quiet; then
            echo "Screenshots already certified."
            exit 0
          fi
          git commit -m "test: recertify README screenshots"
          git push origin HEAD:"$GITHUB_REF_NAME"
