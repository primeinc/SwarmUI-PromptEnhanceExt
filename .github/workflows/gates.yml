name: gates

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  # xunit.v3 >=3.2.0 bundles MTP telemetry; suppress it on every gate surface, matching the justfile.
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check:frontend-parity
      - run: npm run test:frontend

  csharp:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mcmonkeyprojects/SwarmUI
          ref: 96a4c3d14a31776bab5e3300301e078c15875f22
          path: SwarmUI
      - uses: actions/checkout@v4
        with:
          path: SwarmUI/src/Extensions/PromptEnhance
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build SwarmUI/src/SwarmUI.csproj -c Release -o SwarmUI/src/bin/live_release
      - run: dotnet test SwarmUI/src/Extensions/PromptEnhance/Tests/PromptEnhance.Tests.csproj -c Debug
      - run: dotnet test SwarmUI/src/Extensions/PromptEnhance/Tests/PromptEnhance.Tests.csproj -c Debug -p:TestingPlatformDotnetTestSupport=true
      - run: dotnet run --project SwarmUI/src/Extensions/PromptEnhance/Tests/PromptEnhance.Tests.csproj -c Debug

  csharp-vendored:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mcmonkeyprojects/SwarmUI
          ref: 96a4c3d14a31776bab5e3300301e078c15875f22
          path: vendor/SwarmUI
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test Tests/PromptEnhance.Tests.csproj -c Debug
      - run: dotnet test Tests/PromptEnhance.Tests.csproj -c Debug -p:TestingPlatformDotnetTestSupport=true
      - run: dotnet run --project Tests/PromptEnhance.Tests.csproj -c Debug
